name: rajdoll

# Only `api` publishes a port, and only on 127.0.0.1 (TRD 2.2, 9).
# `db` and `tools` are reachable only on the internal Docker network.

x-app-env: &app-env
  RAJDOLL_DATABASE_URL: postgresql+psycopg://rajdoll_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/rajdoll
  RAJDOLL_SECRETS_DIR: /secrets
  RAJDOLL_TOOLS_URL: http://tools:9000
  RAJDOLL_PROXY_URL: http://tools:8081
  RAJDOLL_TOOLS_TOKEN: ${TOOLS_TOKEN:?Set TOOLS_TOKEN in .env (see .env.example)}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: rajdoll-app:dev
  env_file:
    - path: .env
      required: false
  volumes:
    - secrets:/secrets
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rajdoll
      POSTGRES_USER: rajdoll_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rajdoll_app -d rajdoll"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    environment:
      <<: *app-env
      # Only api needs this: its startup bootstrap enables login for the rajdoll_tools role.
      RAJDOLL_TOOLS_DB_PASSWORD: ${TOOLS_DB_PASSWORD:?Set TOOLS_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    environment:
      <<: *app-env
    command: ["python", "-m", "rajdoll.worker"]
    depends_on:
      # api runs migrations at startup, so waiting for it guarantees an up-to-date schema.
      api:
        condition: service_healthy
      tools:
        condition: service_healthy

  tools:
    build:
      context: .
      dockerfile: tools/Dockerfile
    image: rajdoll-tools:dev
    environment:
      # Least-privilege role (BSD 8): can read scope and tasks, and insert audit rows only.
      RAJDOLL_PROXY_DATABASE_URL: postgresql://rajdoll_tools:${TOOLS_DB_PASSWORD:?Set TOOLS_DB_PASSWORD in .env (see .env.example)}@db:5432/rajdoll
      RAJDOLL_TOOLS_TOKEN: ${TOOLS_TOKEN:?Set TOOLS_TOKEN in .env (see .env.example)}
    expose:
      - "9000"
      - "8081"
    volumes:
      - tools-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      # The rajdoll_tools role can log in only after api's bootstrap has run.
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  secrets:
  # Proxy CA and, from F3b, nuclei templates. Deliberately separate from `secrets`, which the
  # tools container must never see.
  tools-data:
