name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rajdoll_app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rajdoll_app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RAJDOLL_TEST_DATABASE_URL: postgresql+psycopg://rajdoll_app:ci@127.0.0.1:5432/postgres
      RAJDOLL_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest
        run: pytest

  compose-smoke:
    # Builds the images and starts the four services, proving the F0 exit criterion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check api health
        run: curl -fsS http://127.0.0.1:8000/health
      - name: Check migrations ran (17 tables + alembic_version)
        run: |
          count=$(docker compose exec -T db psql -U rajdoll_app -d rajdoll -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          echo "public tables: $count"
          test "$count" -eq 18
      - name: Check master key was created
        run: docker compose exec -T api test -s /secrets/master.key
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
