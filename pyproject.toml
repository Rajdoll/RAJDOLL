[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rajdoll"
version = "1.0.0.dev0"
description = "Personal web vulnerability assessment assistant (deterministic pipeline with bounded local-LLM help)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.7",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "httpx2==2.16.0",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
include = ["rajdoll*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
