{% extends layout %}
{% block title %}Checkpoint scan #{{ scan.number }} · RAJDOLL{% endblock %}
{% block content %}
{% include "_engagement_header.html" %}
<p><a href="/scans/{{ scan.id }}">← Monitor scan #{{ scan.number }}</a></p>
<div{% if not finished %} hx-ext="sse" sse-connect="/scans/{{ scan.id }}/events/stream?after_id={{ last_event_id }}" sse-close="done"{% endif %}>
  <section id="scan-status" sse-swap="stage">{% include "_scan_status.html" %}</section>
</div>
<div id="checkpoint-plan">{% include "_checkpoint_plan.html" %}</div>
{% endblock %}
