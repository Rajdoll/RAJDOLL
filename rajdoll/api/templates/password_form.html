<form id="password-form" hx-post="/settings/password" hx-target="this" hx-swap="outerHTML">
  <fieldset>
    <legend><strong>Ganti password</strong></legend>
    {% if password_saved %}<p class="success" role="status">Password diganti. Sesi login lain sudah dikeluarkan.</p>{% endif %}
    {% if password_error %}<p class="error" role="alert">{{ password_error }}</p>{% endif %}
    <label>
      Password saat ini
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <div class="grid">
      <label>
        Password baru
        <input type="password" name="new_password" minlength="12" required autocomplete="new-password">
      </label>
      <label>
        Ulangi password baru
        <input type="password" name="new_password_confirm" minlength="12" required autocomplete="new-password">
      </label>
    </div>
  </fieldset>
  <button type="submit" class="secondary">Ganti password</button>
</form>
